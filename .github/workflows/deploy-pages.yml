name: Deploy protected site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the published branch
        uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-elt.txt

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.2"
          use-public-rspm: true

      - name: Restore report-reader library
        uses: actions/cache@v5
        with:
          path: ${{ env.R_LIBS_USER }}
          key: report-reader-${{ runner.os }}-r4.5.2-${{ hashFiles('scripts/install_elt_r.R') }}

      - name: Install AER extraction reader
        run: Rscript scripts/install_elt_r.R

      - name: Validate calculations and published data
        run: |
          python -m pip install -r scripts/requirements-elt.txt
          mkdir -p data/processed
          node --check src/main.js
          node --test scripts/test_app_runtime.cjs scripts/test_refinery_model.cjs
          python -m unittest discover -s scripts -p 'test_*.py'
          python scripts/validate_production_data.py
          python scripts/validate_infrastructure_layers.py

      - name: Build the public artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -R src _site/
          mkdir -p _site/public
          cp -R public/data _site/public/

          # These large source exports are not referenced by the browser app.
          rm -f \
            _site/public/data/aer_feeder_pipelines.geojson \
            _site/public/data/aer_pipeline_installations.geojson \
            _site/public/data/production_assets.geojson

          if ! grep -Fqi "staticrypt" _site/index.html; then
            echo "Refusing to deploy: index.html is not a StatiCrypt wrapper." >&2
            exit 1
          fi

          if grep -Fq "src/main.js" _site/index.html; then
            echo "Refusing to deploy: index.html contains the plaintext app entry point." >&2
            exit 1
          fi

          if [[ -e _site/index.src.html ]]; then
            echo "Refusing to deploy: plaintext index.src.html is in the public artifact." >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload the protected site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
