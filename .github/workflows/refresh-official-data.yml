name: Refresh official application data

on:
  schedule:
    - cron: "17 7 * * *"
    - cron: "37 8 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "Data family to refresh"
        type: choice
        options: [production, infrastructure]
        default: production
      sources:
        description: "Production sources (comma separated); blank checks all"
        type: string
        default: ""
      update_months:
        description: "Recent publication months to recheck (1–120)"
        type: number
        default: 3
      full_revision_scan:
        description: "Check historical publication revisions"
        type: boolean
        default: false
      history_start:
        description: "Optional official backfill start YYYY-MM"
        type: string
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: official-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      WORK_DIR: data/processed/official-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-elt.txt

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.2"
          use-public-rspm: true

      - name: Restore report-reader library
        uses: actions/cache@v5
        with:
          path: ${{ env.R_LIBS_USER }}
          key: report-reader-${{ runner.os }}-r4.5.2-${{ hashFiles('scripts/install_elt_r.R') }}

      - name: Install official report readers
        run: |
          python -m pip install -r scripts/requirements-elt.txt
          Rscript scripts/install_elt_r.R

      - name: Restore replaceable source cache
        uses: actions/cache/restore@v5
        with:
          path: |
            data/raw
          key: official-inputs-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: official-inputs-v1-

      - name: Check parsers and release boundaries
        run: |
          node --check src/main.js
          node --test scripts/test_app_runtime.cjs scripts/test_refinery_model.cjs scripts/test_production_reporting.cjs
          python -m unittest discover -s scripts -p 'test_*.py'

      - name: Stage and validate official updates
        id: ingest
        continue-on-error: true
        env:
          REQUEST_MODE: ${{ inputs.mode }}
          REQUEST_SOURCES: ${{ inputs.sources }}
          REQUEST_MONTHS: ${{ inputs.update_months }}
          REQUEST_HISTORY: ${{ inputs.history_start }}
          REQUEST_REVISIONS: ${{ inputs.full_revision_scan }}
          SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          set -euo pipefail
          mode="${REQUEST_MODE:-production}"
          if [[ "$SCHEDULE" == "37 8 * * 0" ]]; then mode=infrastructure; fi
          args=(--mode "$mode" --work-dir "$WORK_DIR" --update-months "${REQUEST_MONTHS:-3}" --promote)
          if [[ -n "$REQUEST_SOURCES" ]]; then args+=(--sources "$REQUEST_SOURCES"); fi
          if [[ -n "$REQUEST_HISTORY" ]]; then args+=(--history-start "$REQUEST_HISTORY"); fi
          if [[ "$REQUEST_REVISIONS" == true ]] || [[ "$SCHEDULE" == "17 7 * * *" && "$(date -u +%u)" == 7 ]]; then
            args+=(--full-revision-scan)
          fi
          python scripts/elt_pipeline.py "${args[@]}"

      - name: Archive exact changed official inputs
        id: archive
        if: always() && hashFiles(format('{0}/pipeline_result.json', env.WORK_DIR)) != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/archive_elt_sources.py --result "$WORK_DIR/pipeline_result.json" --output-dir "$WORK_DIR/archive" --publish

      - name: Publish validated changes or failure status
        id: publish
        if: always() && steps.archive.outcome == 'success'
        run: python scripts/publish_data_update.py --result "$WORK_DIR/pipeline_result.json" --message "Refresh official application data" --push

      - name: Deploy the validated release
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main

      - name: Save replaceable source cache
        if: steps.ingest.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: |
            data/raw
          key: official-inputs-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Record run summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$WORK_DIR/summary.md" ]]; then cat "$WORK_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: official-data-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            ${{ env.WORK_DIR }}/logs
            ${{ env.WORK_DIR }}/pipeline_result.json
            ${{ env.WORK_DIR }}/ingestion.json
            ${{ env.WORK_DIR }}/aer_infrastructure_result.json
            ${{ env.WORK_DIR }}/summary.md
            ${{ env.WORK_DIR }}/archive/source-manifest.json
          if-no-files-found: warn

      - name: Report rejected candidate
        if: always() && steps.ingest.outcome == 'failure'
        run: exit 1
